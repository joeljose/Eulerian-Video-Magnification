name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly, so dependency drift shows up early

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: |
          docker build -t evm-ci .

      - name: Lint
        run: docker run --rm --entrypoint "" evm-ci ruff check .

      - name: Unit tests
        run: docker run --rm --entrypoint "" evm-ci python -m pytest tests -q

      - name: Verify --help and --version
        run: |
          docker run --rm --entrypoint "" evm-ci python evm.py --help
          docker run --rm --entrypoint "" evm-ci python evm.py --version

      - name: Run full pipeline on face.mp4
        run: |
          docker run --rm --entrypoint "" --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/data" \
            evm-ci \
            python -u evm.py -i /data/face.mp4 -o /data/face_magnified.avi -fl 0.83 -fh 1.0 -a 50 --lambda-c 1000

      - name: Verify output is magnified
        run: |
          docker run --rm -i --entrypoint "" -v "${{ github.workspace }}:/data" evm-ci python - <<'PY'
          import cv2
          import numpy as np

          import evm

          def band_energy(path):
              frames, fps = evm.read_frames(path)
              small = np.stack([cv2.resize(f, (66, 74), interpolation=cv2.INTER_AREA)
                                for f in frames]).astype(np.float32)
              power = np.abs(np.fft.rfft(small, axis=0)) ** 2
              freqs = np.fft.rfftfreq(len(small), 1 / fps)
              return frames.shape, power[(freqs > 0.83) & (freqs < 1.0)].sum()

          in_shape, in_energy = band_energy("/data/face.mp4")
          out_shape, out_energy = band_energy("/data/face_magnified.avi")
          ratio = out_energy / in_energy
          print(f"shape {out_shape}, pulse-band energy ratio {ratio:.2f}")
          assert out_shape == in_shape == (301, 592, 528, 3), out_shape
          assert ratio > 2, "output is not magnified in the pulse band"
          PY
