name: CUDA image

# The CUDA image is several GB, so only build it when its inputs change.
# The CUDA pipeline logic is tested on every run by the CPU job's shim test.
on:
  push:
    branches: [main]
    paths: [Dockerfile.cuda, evm.py, evm_cuda.py, requirements-cuda.txt, requirements-dev.txt]
  pull_request:
    branches: [main]
    paths: [Dockerfile.cuda, evm.py, evm_cuda.py, requirements-cuda.txt, requirements-dev.txt]

permissions:
  contents: read

jobs:
  test-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build CUDA Docker image
        run: |
          docker build -f Dockerfile.cuda \
            --build-arg UID=$(id -u) \
            --build-arg GID=$(id -g) \
            --build-arg UNAME=$(whoami) \
            -t evm-cuda-ci .

      - name: Verify import, --help and --version
        run: |
          docker run --rm --entrypoint "" evm-cuda-ci python3 -c "import evm, cupy"
          docker run --rm --entrypoint "" evm-cuda-ci python3 evm.py --help
          docker run --rm --entrypoint "" evm-cuda-ci python3 evm_cuda.py --version
