name: CUDA image

# The CUDA image is several GB, so only build it when its inputs change.
# The CUDA pipeline logic is tested on every run by the CPU job's shim test.
on:
  push:
    branches: [main]
    paths: [Dockerfile.cuda, evm.py, evm_cuda.py, requirements-cuda.txt, requirements-cuda.lock, requirements-dev.txt]
  pull_request:
    branches: [main]
    paths: [Dockerfile.cuda, evm.py, evm_cuda.py, requirements-cuda.txt, requirements-cuda.lock, requirements-dev.txt]

permissions:
  contents: read

jobs:
  test-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build CUDA Docker image
        run: |
          docker build -f Dockerfile.cuda -t evm-cuda-ci .

      - name: Verify import, --help and --version
        run: |
          docker run --rm --entrypoint "" evm-cuda-ci python -c "import evm, cupy"
          docker run --rm --entrypoint "" evm-cuda-ci python evm.py --help
          docker run --rm --entrypoint "" evm-cuda-ci python evm_cuda.py --version
