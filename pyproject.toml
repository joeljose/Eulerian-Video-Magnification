[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "evm-magnify"
dynamic = ["version"]
description = "Eulerian Video Magnification on the CPU (NumPy) or an NVIDIA GPU (CuPy)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23,<3",
    "opencv-python-headless>=4.7.0,<5",
    "scipy>=1.9,<2",
]

[project.optional-dependencies]
# CuPy plus the CUDA libraries as pip wheels; needs only the NVIDIA driver
cuda = [
    "cupy-cuda12x>=13,<14",
    "nvidia-cuda-runtime-cu12>=12,<13",
    "nvidia-cuda-nvrtc-cu12>=12,<13",
    "nvidia-cufft-cu12>=11,<12",
    "nvidia-cublas-cu12>=12,<13",
]

[project.scripts]
evm = "evm:main"

[tool.setuptools]
py-modules = ["evm"]

[tool.setuptools.dynamic]
version = {attr = "evm.__version__"}

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
